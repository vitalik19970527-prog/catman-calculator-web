<script>
(function(){
  // Custom Ctrl+wheel zoom, replacing the browser's native one entirely.
  // Two reasons native zoom isn't good enough here: (1) its per-notch step
  // size isn't controllable from a web page at all -- there's no API for
  // it, so getting exactly 5% steps requires doing zoom ourselves; (2) the
  // CSS `zoom` property (not `transform: scale`) is used deliberately --
  // `transform: scale` only shrinks things visually without changing
  // layout size, so content that should now fit within a smaller-looking
  // page stays clipped by its unchanged-size scroll container. `zoom`
  // actually reflows layout at the new size, so more of the app becomes
  // visible/scrollable exactly like real browser page zoom does.
  // `zoom` is Chromium/WebKit-only (not Firefox) -- feature-detected below,
  // falling back to leaving native zoom alone on browsers without it.
  if (!('zoom' in document.documentElement.style)) return;

  var scale = 1.0;
  var MIN = 0.5, MAX = 2.0, STEP = 0.05;

  window.addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    scale = e.deltaY < 0
      ? Math.min(MAX, scale + STEP)
      : Math.max(MIN, scale - STEP);
    document.body.style.zoom = scale;
  }, {capture: true, passive: false});
})();
</script>

  <div id="loading">
    <style>
      body {
        inset: 0;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
      }

      #loading {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      #loading img {
        animation: 1s ease-in-out 0s infinite alternate breathe;
        opacity: .66;
        transition: opacity .4s;
      }

      #loading.main_done img {
        opacity: 1;
      }

      #loading.init_done img {
        animation: .33s ease-in-out 0s 1 forwards zooooom;
        opacity: .05;
      }

      @keyframes breathe {
        from {
          transform: scale(0.4);
          opacity: 1.0;
        }

        to {
          transform: scale(0.35);
          opacity: .7;
        }
      }

      @keyframes zooooom {
        from {
          transform: scale(0.4)
        }

        to {
          transform: scale(10)
        }
      }
    </style>
    <img src="icons/loading-animation.png" alt="Loading..." />
  </div>
